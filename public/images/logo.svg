<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70" fill="none">
  <defs>
    <linearGradient id="boxGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="boxGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="boxGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#DC2626" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern 3D Corrugated Box & Flute Emblem Icon -->
  <g transform="translate(6, 7)" filter="url(#subtleGlow)">
    <!-- Top Face -->
    <path d="M28 4 L48 15 L28 26 L8 15 Z" fill="url(#boxGradAccent)" opacity="0.95" />
    <!-- Left Face -->
    <path d="M8 15 L28 26 L28 50 L8 39 Z" fill="url(#boxGradPrimary)" />
    <!-- Right Face -->
    <path d="M28 26 L48 15 L48 39 L28 50 Z" fill="url(#boxGradDark)" />
    
    <!-- Corrugation / Fluting waves accent on front face -->
    <path d="M12 28 Q 18 31 24 28" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M12 34 Q 18 37 24 34" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M12 40 Q 18 43 24 40" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Ribbon / Tape Accent -->
    <path d="M28 4 L28 26" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Typography: SAROJ PACKAGING -->
  <!-- "SAROJ" in bold dark charcoal with red dot -->
  <text x="68" y="36" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="29" font-weight="900" letter-spacing="-0.02em" fill="#111827">
    SAROJ
  </text>

  <!-- "PACKAGING" in bold warm amber/red tone -->
  <text x="175" y="36" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="29" font-weight="800" letter-spacing="-0.01em" fill="#DC2626">
    PACKAGING
  </text>

  <!-- Tagline / Subtitle -->
  <text x="69" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="0.18em" fill="#4B5563">
    PREMIUM CORRUGATED &amp; INDUSTRIAL SOLUTIONS
  </text>

  <!-- Greater Noida Badge -->
  <text x="69" y="62" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.08em" fill="#9CA3AF">
    GREATER NOIDA • EST. 2001
  </text>
</svg>
